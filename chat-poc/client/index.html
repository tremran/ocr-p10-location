<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; }
        .card { max-width: 700px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        select, button, input { width: 100%; padding: 0.75rem; margin-top: 0.75rem; border-radius: 8px; border: 1px solid #d7dce5; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
        #chat { display: none; margin-top: 1.5rem; }
        .messages { border: 1px solid #e5e7eb; border-radius: 8px; min-height: 220px; max-height: 320px; overflow-y: auto; padding: 1rem; background: #fafafa; }
        .message { margin: 0.5rem 0; padding: 0.5rem 0.75rem; border-radius: 8px; }
        .customer { background: #dbeafe; margin-left: 1rem; }
        .agency { background: #dcfce7; margin-right: 1rem; }
        .meta { font-size: 0.75rem; color: #4b5563; }
        #setup, #chat { display: none; }
        #loginError { color: #b91c1c; min-height: 1.25rem; margin-top: 0.75rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Chat client</h1>

    <div id="login">
        <label for="username">Identifiant</label>
        <input id="username" type="text" autocomplete="username" placeholder="client1" />
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" />
        <button id="loginButton">Se connecter</button>
        <div id="loginError" role="alert"></div>
    </div>

    <div id="setup">
        <p id="clientIdentity"></p>
        <label for="agencySelect">Choisir une agence</label>
        <select id="agencySelect"></select>
        <button id="startChat">Lancer le chat</button>
    </div>

    <div id="chat">
        <p id="conversationAgency"></p>
        <div class="messages" id="messages"></div>
        <div id="messageForm">
            <input id="messageInput" type="text" placeholder="Votre message..." />
            <button id="sendMessage">Envoyer</button>
        </div>
    </div>
</div>

<script>
    const apiBase = 'http://localhost:8080/api';
    let socket;
    let stompClient;
    let conversationSubscription;
    let currentConversation = null;
    let guestId = null;
    let currentClient = null;

    const loginButton = document.getElementById('loginButton');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');
    const loginEl = document.getElementById('login');
    const clientIdentity = document.getElementById('clientIdentity');
    const setupEl = document.getElementById('setup');
    const agencySelect = document.getElementById('agencySelect');
    const startChatButton = document.getElementById('startChat');
    const sendMessageButton = document.getElementById('sendMessage');
    const messageInput = document.getElementById('messageInput');
    const messagesEl = document.getElementById('messages');
    const chatEl = document.getElementById('chat');
    const messageForm = document.getElementById('messageForm');
    const conversationAgency = document.getElementById('conversationAgency');

    async function login() {
        loginError.textContent = '';
        const response = await fetch(`${apiBase}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: usernameInput.value.trim(),
                password: passwordInput.value
            })
        });

        if (!response.ok) {
            loginError.textContent = 'Identifiants invalides';
            return;
        }

        currentClient = await response.json();
        guestId = currentClient.username;
        clientIdentity.textContent = `Connecté en tant que ${currentClient.displayName}`;
        loginEl.style.display = 'none';
        await loadAgencies();
        await restoreActiveConversation();
    }

    async function loadAgencies() {
        const response = await fetch(`${apiBase}/agencies`);
        const agencies = await response.json();
        agencies.forEach((agency) => {
            const option = document.createElement('option');
            option.value = agency.code;
            option.textContent = `${agency.name} (${agency.code})`;
            agencySelect.appendChild(option);
        });
    }

    async function restoreActiveConversation() {
        const response = await fetch(`${apiBase}/clients/${encodeURIComponent(guestId)}/active-conversation`);
        if (response.status === 204) {
            setupEl.style.display = 'block';
            return;
        }

        const conversation = await response.json();
        await openConversation(conversation);
    }

    async function connectSocket() {
        const azureResponse = await fetch(
            `${apiBase}/realtime/client-url?userId=${encodeURIComponent(guestId)}&group=conversation-${currentConversation.id}`
        );
        if (azureResponse.ok) {
            const { url } = await azureResponse.json();
            const azureSocket = new WebSocket(url, 'json.webpubsub.azure.v1');
            azureSocket.onmessage = (event) => {
                const payload = parseRealtimePayload(event.data);
                if (!payload || !payload.senderType) return;
                appendMessage(payload.senderType, payload.content, payload.createdAt);
                if (payload.status === 'CLOSED') {
                    currentConversation.status = 'CLOSED';
                    updateMessageForm();
                    clientIdentity.textContent = 'Conversation terminée. Choisissez une agence pour lancer un nouveau chat.';
                    setupEl.style.display = 'block';
                }
            };
            return;
        }

        const socketUrl = 'http://localhost:8080/ws';
        socket = new SockJS(socketUrl);
        stompClient = Stomp.over(socket);
        stompClient.connect({}, () => {
            subscribeToConversation();
        });
    }

    function subscribeToConversation() {
        if (conversationSubscription) {
            conversationSubscription.unsubscribe();
        }

        conversationSubscription = stompClient.subscribe(`/topic/conversation.${currentConversation.id}`, (message) => {
            const payload = JSON.parse(message.body);
            appendMessage(payload.senderType, payload.content, payload.createdAt);
            if (payload.status === 'CLOSED') {
                currentConversation.status = 'CLOSED';
                updateMessageForm();
                clientIdentity.textContent = 'Conversation terminée. Choisissez une agence pour lancer un nouveau chat.';
                setupEl.style.display = 'block';
            }
        });
    }

    async function startChat() {
        if (!guestId) return;
        const agencyCode = agencySelect.value;
        const response = await fetch(`${apiBase}/conversations/start`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agencyCode, guestId })
        });

        await openConversation(await response.json());
    }

    async function openConversation(conversation) {
        currentConversation = conversation;
        clientIdentity.textContent = `Connecté en tant que ${currentClient.displayName}`;
        conversationAgency.textContent = `Conversation avec ${conversation.agencyName}`;
        setupEl.style.display = 'none';
        chatEl.style.display = 'block';
        updateMessageForm();
        messagesEl.innerHTML = '';

        const historyResponse = await fetch(`${apiBase}/conversations/${currentConversation.id}/messages`);
        const history = await historyResponse.json();
        history.forEach(item => appendMessage(item.senderType, item.content, item.createdAt));

        if (!stompClient || !stompClient.connected) {
            connectSocket();
        } else {
            subscribeToConversation();
        }
    }

    function appendMessage(senderType, content, createdAt) {
        const item = document.createElement('div');
        item.className = `message ${senderType === 'CUSTOMER' ? 'customer' : 'agency'}`;
        const meta = document.createElement('div');
        meta.className = 'meta';
        const parsedDate = createdAt ? new Date(createdAt) : null;
        const timestamp = parsedDate && !Number.isNaN(parsedDate.getTime())
            ? parsedDate.toLocaleTimeString()
            : '';
        meta.textContent = `${senderType === 'CUSTOMER' ? 'Vous' : 'Agence'}${timestamp ? ` · ${timestamp}` : ''}`;
        const body = document.createElement('div');
        body.textContent = content;
        item.appendChild(meta);
        item.appendChild(body);
        messagesEl.appendChild(item);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function parseRealtimePayload(rawMessage) {
        const envelope = typeof rawMessage === 'string' ? JSON.parse(rawMessage) : rawMessage;
        if (envelope.type !== 'message') return envelope;
        return typeof envelope.data === 'string' ? JSON.parse(envelope.data) : envelope.data;
    }

    function updateMessageForm() {
        messageForm.style.display = currentConversation?.status === 'OPEN' ? 'block' : 'none';
    }

    async function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || !currentConversation) return;

        const payload = {
            conversationId: String(currentConversation.id),
            senderType: 'CUSTOMER',
            guestId,
            content
        };

        await fetch(`${apiBase}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        messageInput.value = '';
    }

    loginButton.addEventListener('click', login);
    passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') login();
    });
    startChatButton.addEventListener('click', startChat);
    sendMessageButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
    });

</script>
</body>
</html>
